[package]
name = "codex-remote-bridge"
version = "0.1.0"
edition = "2024"
description = "Experimental bridge from ChatGPT Codex Remote Control to Cursor ACP"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
codex-app-server-transport = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
codex-login = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
codex-state = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
codex-utils-pty = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
# Keep prerelease Rama crates on the exact family captured by Codex's lockfile;
# Cargo's normal caret resolution otherwise mixes them with incompatible 0.3.0.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"

# Codex 0.145.0 enables proxy support that was carried in OpenAI's maintained
# tungstenite forks at this tag. Git dependencies do not inherit the source
# workspace's root patch table, so repeat the two relevant pins here.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
