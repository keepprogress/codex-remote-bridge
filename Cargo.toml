[package]
name = "codex-remote-bridge"
version = "0.1.0"
edition = "2024"
description = "Experimental bridge from ChatGPT Codex Remote Control to Cursor ACP"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
codex-app-server-transport = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
codex-login = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
codex-state = { git = "https://github.com/openai/codex.git", tag = "rust-v0.145.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "warn"
pedantic = "warn"

